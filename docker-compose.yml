services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: loadforge
      POSTGRES_USER: loadforge
      POSTGRES_PASSWORD: loadforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loadforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  # LoadForge Controller (Node.js)
  controller:
    build:
      context: .
      dockerfile: docker/Dockerfile.controller
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: loadforge
      DB_USER: loadforge
      DB_PASSWORD: loadforge
    depends_on:
      postgres:
        condition: service_healthy

  # LoadForge Worker (C++ engine)
  worker-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.engine
    command: ["--worker", "--worker-port", "9090", "--worker-id", "worker-1"]
    ports:
      - "9091:9090"
    depends_on:
      - controller

  worker-2:
    build:
      context: .
      dockerfile: docker/Dockerfile.engine
    command: ["--worker", "--worker-port", "9090", "--worker-id", "worker-2"]
    ports:
      - "9092:9090"
    depends_on:
      - controller

  # LoadForge Dashboard (React)
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - controller

  # Example target server
  target:
    build:
      context: .
      dockerfile: docker/Dockerfile.target
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      LATENCY_MS: 10

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      - controller

  # Grafana
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3030:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
